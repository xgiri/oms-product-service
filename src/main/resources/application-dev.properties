# ---------------------------------------------------------------------------
# dev profile local development (docker-compose up, or an IDE run config).
# No JWT keys here at all, unlike oms-main's dev profile this service only
# verifies tokens via jwk-set-uri (see application.properties), it never
# signs one, so there's no keypair for it to default.
# ---------------------------------------------------------------------------

logging.level.root=INFO
logging.level.com.giri.oms=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.info.env.enabled=true

# Throwaway local-only defaults same pattern as oms-main's dev profile.
# Any real deployment must set DB_USERNAME/DB_PASSWORD explicitly.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.show-sql=true
