spring.application.name=product-service

# Same web/worker split pattern as oms-main (see docs there on APP_PROCESS_ROLE)
# OutboxPublisher below is still gated the same way, so this service can
# scale its API and its outbox-flushing independently too, if that's ever
# needed. Unset = both, matching oms-main's default.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# Own dedicated database not oms_product, no schema qualifier needed; see
# the note in Product.java/ProductRepository.java on why the "oms_product."
# prefix from the monolith's Phase 3 schema split was dropped here.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:product_service}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Kafka producer only in Stage 1 (see messaging.config.KafkaConfig). Same
# topic name as oms-main expects (oms.product.events) so the monolith's
# ProductEventInventoryConsumer needs zero changes.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topics.product-events=oms.product.events
app.kafka.outbox.poll-interval-ms=5000
app.kafka.outbox.batch-size=100

# Redis backs the ProductResponse cache only (see common.config.CacheConfig).
# No Redisson/distributed locking or Bucket4j rate limiting here those are
# inventory and auth concerns respectively; neither lives in this service.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:1}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# JWT *verification* only no signing/issuing here (see security.SecurityConfig,
# and compare to oms-main's jwt.private-key/jwt.public-key, which don't exist
# in this service at all). Points at the monolith's existing JWKS endpoint;
# nothing about how tokens are issued changes, only how this service verifies
# them. Defaults to the monolith's local dev address override for any real
# deployment.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVICE_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %-5level %logger{36} - %msg%n
logging.level.org.apache.kafka.clients=WARN
logging.level.org.apache.kafka.clients.consumer.internals.AbstractCoordinator=INFO

# Added as part of Stage 2 of the microservices-prep plan same OTLP endpoint
# oms-main exports to (see that repo's application.properties), so both show
# up as one connected trace in the same Tempo instance rather than two
# separate ones. See pom.xml's comment on the tracing dependencies for why
# this needs no other code/config to actually continue a trace started by
# oms-main's ProductClient call.
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.path=/docs

# Lets springdoc/Swagger UI generate correct absolute paths when reached
# through oms-gateway's /product-service/** prefix instead of directly.
# Same setting oms-gateway itself sets for the identical reason, one hop
# further out.
server.forward-headers-strategy=framework

# Pins the OpenAPI JSON's path to the exact prefix oms-gateway's
# oms-product-docs route exposes it at, deterministically — only applies
# when reached through the gateway prefix; hitting this service's own host
# port directly and unproxied will 404 on this exact path (use
# /v3/api-docs directly in that case).
springdoc.swagger-ui.url=/product-service/v3/api-docs

# The UI page also makes its own separate bootstrap call to springdoc's
# swagger-config endpoint before it even reads swagger-ui.url above — that
# call is a bare unprefixed absolute path by default
# (/v3/api-docs/swagger-config), which on the gateway matches the oms-docs
# route before ever reaching this service. Pinning it here closes that gap
# the same way.
springdoc.swagger-ui.config-url=/product-service/v3/api-docs/swagger-config

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:8081}

management.metrics.tags.application=${spring.application.name}
management.metrics.tags.role=${APP_PROCESS_ROLE:unset}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

info.app.version=${APP_VERSION:unknown}
info.app.git-sha=${APP_GIT_SHA:unknown}
