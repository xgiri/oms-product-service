# Optional — only applies if you run Prometheus Operator (the
# monitoring.coreos.com/v1 CRDs). If you're using plain Prometheus with
# annotation-based discovery instead, the prometheus.io/scrape annotations
# already on 02-deployment.yaml's pod template cover it and this file isn't
# needed — same split as oms-main's own 09-podmonitor.yaml.
#
# PodMonitor rather than ServiceMonitor for the same reason oms-main uses
# one for its worker role: this is future-proofing for if/when
# product-service splits into web/worker (see 02-deployment.yaml's note) and
# a worker Deployment with no Service appears — PodMonitor selects pods
# directly by label regardless. Not currently load-bearing for that reason
# with only one Deployment, but there's no cost to having it either.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  podMetricsEndpoints:
    - port: metrics   # matches the "metrics" containerPort (8081) in 02-deployment.yaml
      path: /actuator/prometheus
      interval: 30s
