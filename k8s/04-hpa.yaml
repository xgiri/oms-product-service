# CPU-based HPA — same rationale as oms-main's own 05-hpa-web.yaml: works
# out of the box with just metrics-server. Request-rate-based scaling is the
# same available-but-not-implemented upgrade path documented there
# (/actuator/prometheus is already exposed here too) — see that file's
# comment for the two ways to get there (prometheus-adapter + custom metric,
# or a KEDA ScaledObject with KEDA's Prometheus scaler) if CPU ever proves
# to be the wrong signal for this service's actual traffic shape.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
