# Template only — do NOT apply this file as-is or commit real values into
# it. Copy it, fill in real secrets out of band, and apply the copy.
#
# Unlike oms-main's own 01-secret.example.yaml, this genuinely holds the
# real secrets as plain values rather than delegating to Vault —
# product-service has no Vault integration (see its pom.xml's own note:
# "spring-cloud-starter-vault-config — omitted for Stage 1 simplicity").
# That's a real gap worth closing before this ever holds production
# credentials, not a deliberate architectural choice like oms-main's split;
# tracked here rather than silently copying oms-main's Vault-based pattern
# and implying it already works the same way.
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secrets
  labels:
    app.kubernetes.io/name: product-service
type: Opaque
stringData:
  DB_USERNAME: "changeme"
  DB_PASSWORD: "changeme"
  REDIS_PASSWORD: "changeme"
